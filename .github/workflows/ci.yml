name: CI

on:
  push:
    branches: [main, claude/great-johnson-CFSbi]
  pull_request:
    branches: [main]
  # On demand, for any branch. Added 2026-08-06 after a push landed (Vercel deployed it)
  # without GitHub creating a CI run at all, and there was no way to ask for one: the gates
  # could only be re-run by pushing another commit. A pull request with no CI result looks
  # exactly like a pull request whose CI has not finished, and neither is a state to merge
  # from.
  workflow_dispatch:

# The gates only read. A workflow that can write with the default token is a workflow whose
# compromise can push, and CI runs on every pull request, which is the widest door in the
# repository. CAPABILITIES.md item 6, the last Wave 1 code change left undone.
permissions:
  contents: read

# One CI run per branch at a time; a superseded push cancels the stale run instead of
# queueing behind it. Two pushes in a minute used to cost two full builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      # The invoice reader's value checks: the schema fixes the shape, this pins the values.
      - name: Extraction value checks
        run: |
          npx tsc -p scripts/extractvalidate-check/tsconfig.json
          cp scripts/extractvalidate-check/check.js scripts/extractvalidate-check/out/
          node scripts/extractvalidate-check/out/check.js
      # Ask answers: every vendor the answer names must be in what the prompt carried.
      - name: Ask grounding checks
        run: |
          npx tsc -p scripts/askgrounding-check/tsconfig.json
          cp scripts/askgrounding-check/check.js scripts/askgrounding-check/out/
          node scripts/askgrounding-check/out/check.js
      # The automation's own rules, checked like any other code. These are the two
      # decisions nothing else can catch: which changes may merge themselves, and when the
      # watchdog should speak rather than repeat itself.
      - name: Automation rules
        run: |
          node .github/scripts/health-notify.test.mjs
          node --check .github/scripts/classify-change.mjs
          node --check .github/scripts/health-check.mjs
          node --check .github/scripts/health-notify.mjs
          # The Jira autopilot is parked, not deleted: a future board can wake it up. Its
          # tests and syntax checks keep running so it cannot rot into something that no
          # longer works by the time somebody needs it.
          node .github/scripts/jira-find-work.test.mjs
          node .github/scripts/jira-transition.test.mjs
          node .github/scripts/distinct-databases.test.mjs
          node --check .github/scripts/jira-comment.mjs
          node --check .github/scripts/jira-find-work.mjs
          node --check .github/scripts/jira-transition.mjs
          node .github/scripts/slack-find-work.test.mjs
          node --check .github/scripts/slack-find-work.mjs
          node .github/scripts/slack-status.test.mjs
          node .github/scripts/slack-lifecycle-stage.test.mjs
          node --check .github/scripts/slack-say.mjs
          node --check .github/scripts/slack-status.mjs
          node --check .github/scripts/slack-lifecycle-stage.mjs
          # seed_dev.sql must never reach a real database through the migration workflow.
          # It is dev-only dummy data, and run-order.txt is the only list that runs.
          if grep -qE '^\s*seed' supabase/run-order.txt; then
            echo "::error::run-order.txt names a seed file. Seeds are never applied automatically."
            exit 1
          fi
