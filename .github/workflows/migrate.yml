name: Apply database scripts

# Runs the store's SQL scripts against the live database when a change lands on main, so a
# merged migration is applied without anyone opening the Supabase editor. This is the last
# manual step between a merge and a working deploy.
#
# WHAT IS AND IS NOT AUTOMATED HERE, because the distinction is the whole safety argument:
#
#   A schema change still needs a person. supabase/** is tier C in the autopilot's
#   classifier, so no migration merges itself: a human reads the SQL and merges the pull
#   request, exactly as before. What this workflow automates is only the APPLICATION of a
#   migration that a person has already reviewed and merged. The judgement stays human; the
#   typing does not.
#
# It runs only on push to main or develop (post-merge), never from a feature branch, so an
# autopilot branch cannot reach either database. The list of scripts comes from
# supabase/run-order.txt, which deliberately excludes schema.sql, seed.sql, auth_setup.sql
# and seed_dev.sql.
#
# TWO DATABASES, ONE LIST. A push to develop applies to the dev database, a push to main
# applies to production, and both read the same ordered list. That is the point of having a
# dev environment at all: a migration is always exercised against dev before it reaches the
# store's ledger, and it cannot drift between them because there is only one list.
#
# Setup (one time): add SUPABASE_DB_URL as a repository secret, and SUPABASE_DB_URL_DEV once
# the dev project exists. The name is ours and the value comes from Supabase: the SESSION
# POOLER URI on port 5432. Full instructions, including the two connection modes that cannot
# work, are in docs/SUPABASE_SETUP.md, which is the single place that explains this.
#
# Until the relevant secret exists the workflow exits quietly and the scripts stay a manual
# step for that environment.

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would run without touching the database"
        type: boolean
        default: false

concurrency:
  group: apply-database-scripts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Which database this run is for. develop means dev, anything else means production.
      # Decided from the ref rather than from an input, so a dispatch cannot aim a dev change
      # at the store's ledger by mistake.
      - name: Decide which database this is
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
            echo "This run targets the DEV database."
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "This run targets the PRODUCTION database."
          fi

      # Each ref names its own secret. `a && b || c` returns c whenever b is empty, so the
      # expression ends in an empty string rather than another secret: on develop only
      # SUPABASE_DB_URL_DEV is ever read, and without it this step reports skipped.
      - name: Check the connection secret is set
        id: gate
        env:
          PGCONN: ${{ github.ref_name == 'develop' && secrets.SUPABASE_DB_URL_DEV || github.ref_name != 'develop' && secrets.SUPABASE_DB_URL || '' }}
          WHICH: ${{ steps.env.outputs.name }}
        run: |
          # The length, never the value. A length of 0 means the job cannot see the secret,
          # which is a settings problem rather than anything in this file, and printing it
          # turns "skipped" from a mystery into a measurement. It is how a secret that had
          # been saved under a different name was found in August 2026.
          echo "Connection secret length as seen by this job: ${#PGCONN}"
          if [ -z "$PGCONN" ]; then
            echo "No connection secret for $WHICH, so its scripts stay a manual step."
            echo "It must be named exactly SUPABASE_DB_URL (or SUPABASE_DB_URL_DEV for dev),"
            echo "under Settings, Secrets and variables, ACTIONS, Repository secrets."
            echo "See docs/SUPABASE_SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The one hazard docs/ENVIRONMENTS.md names: the dev connection pointing at the live
      # database. That is a clipboard mistake, not a subtle one, and its failure is silent
      # and total: seed_dev.sql would insert eight invented vendors into the store's real
      # directory and nothing would look wrong until somebody saw them. Being careful is not
      # a control, so this is the control. It compares which Supabase project each string
      # belongs to, and prints only that, never a password.
      - name: Refuse to treat production as dev
        if: steps.gate.outputs.ready == 'true' && github.ref_name == 'develop'
        env:
          DEV_CONN: ${{ secrets.SUPABASE_DB_URL_DEV }}
          PROD_CONN: ${{ secrets.SUPABASE_DB_URL }}
        run: node .github/scripts/distinct-databases.mjs

      - name: Apply the scripts in order
        if: steps.gate.outputs.ready == 'true'
        env:
          PGCONN: ${{ github.ref_name == 'develop' && secrets.SUPABASE_DB_URL_DEV || github.ref_name != 'develop' && secrets.SUPABASE_DB_URL || '' }}
          WHICH: ${{ steps.env.outputs.name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # A direct connection resolves only over IPv6 on Supabase projects created since
          # early 2024, and a GitHub runner has no IPv6 route to it. The failure that causes
          # is a bare "network is unreachable" that reads like an outage, so name it here
          # while we can still say something useful.
          case "$PGCONN" in
            *db.*.supabase.co*)
              echo "::warning::This looks like the DIRECT connection, which is IPv6-only and"
              echo "::warning::usually unreachable from a GitHub runner. If the next step fails"
              echo "::warning::to connect, swap the secret for the SESSION POOLER URI:"
              echo "::warning::  postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres"
              ;;
          esac
          # The list is the contract. Anything not named here does not run, so adding a file
          # to supabase/ cannot silently execute against the live database.
          scripts=$(grep -vE '^\s*(#|$)' supabase/run-order.txt)
          echo "Applying to the $WHICH database."
          echo "Scripts to apply, in order:"
          echo "$scripts" | sed 's/^/  /'

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run: nothing was sent to the database."
            exit 0
          fi

          for f in $scripts; do
            path="supabase/$f"
            if [ ! -f "$path" ]; then
              echo "::error::$path is in run-order.txt but does not exist."
              exit 1
            fi
            echo "--- applying $f"
            # ON_ERROR_STOP makes a failing statement fail the run instead of carrying on
            # and leaving the database half-migrated with a green tick.
            psql "$PGCONN" --set ON_ERROR_STOP=1 --quiet --file "$path"
          done
          echo "All scripts applied."

      - name: Ask the site whether it is still healthy
        if: steps.gate.outputs.ready == 'true' && inputs.dry_run != true
        env:
          SITE: ${{ github.ref_name == 'develop' && vars.DEV_URL || (vars.PRODUCTION_URL || 'https://robinsons-store.vercel.app') }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node .github/scripts/health-check.mjs

      # A migration that half-applies against the store's ledger is the most expensive silent
      # failure this repository can produce, and until now the only way to learn about it was
      # to open the Actions tab and think to look. The watchdog has said for weeks that a
      # problem nobody is told about is not monitored; this workflow was exempt from its own
      # principle.
      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: |
            A database script did not apply cleanly to the ${{ steps.env.outputs.name }} database.

            The database may be part way through a change. Nothing else will fix itself. Every
            script here is safe to run again once the cause is fixed.

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/slack-say.mjs

      # Success is worth one line too, but only for production. A change reaching the store's
      # live database is a real event somebody should be able to see happening without being
      # asked to trust that it did.
      - name: Tell Slack it worked
        if: success() && steps.gate.outputs.ready == 'true' && inputs.dry_run != true && steps.env.outputs.name == 'production'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: |
            Database scripts applied to the store's live database, and the site answered healthy afterwards.

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/slack-say.mjs

      - name: Say so when the database and the app disagree
        if: failure()
        run: |
          echo "The scripts did not apply cleanly, or the site is unhealthy afterwards."
          echo "The database may be part-migrated. Check the log above, fix the script, and"
          echo "re-run: every script here is safe to run again."
